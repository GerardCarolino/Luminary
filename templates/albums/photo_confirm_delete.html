{% extends "base.html" %}
{% block title %}Delete Photo{% endblock %}

{% block content %}
<div class="container">
  <div style="max-width:460px;margin:60px auto">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Delete Photo</h2>
      </div>
      <div class="card-body">
        <div style="margin-bottom:20px;border-radius:var(--radius-md);overflow:hidden;background:var(--bg-elevated);border:1px solid var(--border-subtle)">
          <img src="{{ object.image.url }}" alt="Photo" style="width:100%;max-height:200px;object-fit:contain" />
        </div>

        <div class="danger-zone" style="margin-bottom:22px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;margin-top:1px">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          This photo will be permanently deleted and cannot be recovered.
        </div>

        {% if object.caption %}
          <p class="text-sm text-muted" style="margin-bottom:18px">Caption: <em style="color:var(--text-secondary)">{{ object.caption }}</em></p>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Delete Photo</button>
            <a href="{{ object.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
