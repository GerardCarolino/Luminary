{% extends "base.html" %}
{% block title %}Edit Photo{% endblock %}

{% block content %}
<div class="container">
  <div style="max-width:560px;margin:0 auto">
    <div class="page-header">
      <nav class="page-breadcrumb">
        <a href="{{ object.album.get_absolute_url }}" class="breadcrumb-link">{{ object.album.title }}</a>
        <span class="breadcrumb-sep">›</span>
        <a href="{{ object.get_absolute_url }}" class="breadcrumb-link">Photo</a>
        <span class="breadcrumb-sep">›</span>
        <span>Edit</span>
      </nav>
      <h1 class="page-title">Edit Photo</h1>
    </div>

    <div class="card">
      <div class="card-body">
        <!-- Preview -->
        <div style="margin-bottom:20px;border-radius:var(--radius-lg);overflow:hidden;background:var(--bg-elevated);border:1px solid var(--border-subtle)">
          <img src="{{ object.image.url }}" alt="Photo preview" style="width:100%;max-height:280px;object-fit:contain" />
        </div>

        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}
            <div class="form-group">
              <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
              {{ field }}
              {% for error in field.errors %}
                <p class="form-error">{{ error }}</p>
              {% endfor %}
            </div>
          {% endfor %}
          <div class="d-flex gap-2 mt-2">
            <button type="submit" class="btn btn-primary">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
              Save
            </button>
            <a href="{{ object.get_absolute_url }}" class="btn btn-ghost">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
